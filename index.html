<!DOCTYPE html>
<html>
<head><title>Voice Agent</title></head>
<body style="background:#111;color:#fff;font-family:sans-serif;text-align:center;padding:50px">
<h1>🤖 Voice Agent</h1>
<p id="status">Click Start to connect</p>
<button id="btn" onclick="start()" style="padding:20px 40px;font-size:20px;cursor:pointer">▶ Start</button>
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<script>
async function start() {
  document.getElementById('status').innerText = 'Connecting...';
  document.getElementById('btn').disabled = true;
  try {
    const resp = await fetch('/token');
    const data = await resp.json();
    const room = new LivekitClient.Room({
      audioCaptureDefaults: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
      },
    });
    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
      if (track.kind === 'audio') {
        const el = track.attach();
        document.body.appendChild(el);
      }
    });
    room.on(LivekitClient.RoomEvent.Connected, () => {
      document.getElementById('status').innerText = 'Connected! Start talking 🎤';
      document.getElementById('btn').innerText = 'Connected ✅';
    });
    room.on(LivekitClient.RoomEvent.Disconnected, () => {
      document.getElementById('status').innerText = 'Disconnected';
    });
    await room.connect(data.livekit_url, data.token);
    await room.localParticipant.setMicrophoneEnabled(true, {
      echoCancellation: true,
      noiseSuppression: true,
      autoGainControl: true,
    });
  } catch(e) {
    document.getElementById('status').innerText = 'Error: ' + e.message;
    document.getElementById('btn').disabled = false;
  }
}
</script>
</body>
</html>
